# Render Blueprint for the ProjectFlow API (free plan).
# Render dashboard → New → Blueprint → pick this repo. You'll be asked for the values marked `sync: false`.
services:
  - type: web
    name: projectflow-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: >-
      npm ci --include=dev &&
      npm run build -w @pms/api &&
      npm run db:deploy -w @pms/api
    startCommand: npm run start -w @pms/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: LOG_LEVEL
        value: info
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: '900'
      - key: REFRESH_TOKEN_TTL_DAYS
        value: '7'
      - key: RATE_LIMIT_LOGIN_MAX
        value: '5'
      - key: RATE_LIMIT_REGISTER_MAX
        value: '30'
      - key: RATE_LIMIT_API_MAX
        value: '1000'
      # Neon pooled connection string (…-pooler…?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Neon direct connection string (used by prisma migrate)
      - key: DIRECT_URL
        sync: false
      # The Vercel URL of the web app, e.g. https://projectflow-pronov06.vercel.app
      - key: CORS_ORIGINS
        sync: false
