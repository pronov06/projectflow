<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">ProjectFlow architecture</title>
  <desc id="d">The React web app and the Android app both call one Express REST API, which stores data in PostgreSQL through Prisma. Animated packets show requests and responses.</desc>
  <style>
    text { font-family: 'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
    .h { font-size: 21px; letter-spacing: -0.3px; }
    .b { font-size: 13.5px; }
    .c { font-size: 11.5px; letter-spacing: 0.4px; }
    .wire { fill: none; stroke: #ccdad7; stroke-width: 3; }
    .flow { fill: none; stroke: #56f09f; stroke-width: 3; stroke-dasharray: 6 14; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -40; } }
    .breathe { animation: breathe 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 50% { transform: scale(1.015); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="360" rx="28" fill="#fffbec" />

  <!-- Connection paths -->
  <path id="p-web" class="wire" d="M300 92 C 390 92, 380 152, 470 152" />
  <path id="p-app" class="wire" d="M300 268 C 390 268, 380 208, 470 208" />
  <path id="p-db" class="wire" d="M730 180 L 900 180" />
  <path class="flow" d="M300 92 C 390 92, 380 152, 470 152" />
  <path class="flow" d="M300 268 C 390 268, 380 208, 470 208" />
  <path class="flow" d="M730 180 L 900 180" />

  <!-- Request packets (mint) and responses (forest) -->
  <circle r="6" fill="#56f09f" stroke="#004737" stroke-width="2">
    <animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#p-web" /></animateMotion>
  </circle>
  <circle r="5" fill="#004737">
    <animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p-web" /></animateMotion>
  </circle>
  <circle r="6" fill="#56f09f" stroke="#004737" stroke-width="2">
    <animateMotion dur="2.6s" begin="0.6s" repeatCount="indefinite"><mpath href="#p-app" /></animateMotion>
  </circle>
  <circle r="5" fill="#004737">
    <animateMotion dur="2.6s" begin="1.9s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p-app" /></animateMotion>
  </circle>
  <circle r="6" fill="#56f09f" stroke="#004737" stroke-width="2">
    <animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite"><mpath href="#p-db" /></animateMotion>
  </circle>
  <circle r="5" fill="#004737">
    <animateMotion dur="1.6s" begin="1.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p-db" /></animateMotion>
  </circle>

  <!-- Edge labels -->
  <text class="c" x="385" y="78" text-anchor="middle" fill="#48655e">/api rewrite · httpOnly cookie</text>
  <text class="c" x="385" y="300" text-anchor="middle" fill="#48655e">HTTPS · Bearer JWT</text>
  <text class="c" x="815" y="166" text-anchor="middle" fill="#48655e">Prisma · parameterised SQL</text>

  <!-- Web app -->
  <g>
    <rect x="40" y="40" width="260" height="104" rx="19" fill="#004737" />
    <text class="c" x="62" y="68" fill="#99b5af">CLIENT · VERCEL</text>
    <text class="h" x="62" y="96" fill="#fffbec">Web app</text>
    <text class="b" x="62" y="122" fill="#99b5af">React 19 · Vite · Tailwind 4</text>
  </g>

  <!-- Android app -->
  <g>
    <rect x="40" y="216" width="260" height="104" rx="19" fill="#004737" />
    <text class="c" x="62" y="244" fill="#99b5af">CLIENT · ANDROID APK</text>
    <text class="h" x="62" y="272" fill="#fffbec">Mobile app</text>
    <text class="b" x="62" y="298" fill="#99b5af">Expo SDK 57 · expo-router</text>
  </g>

  <!-- API -->
  <g class="breathe">
    <rect x="470" y="112" width="260" height="136" rx="19" fill="#56f09f" />
    <text class="c" x="492" y="140" fill="#004737">SERVER · VERCEL FUNCTIONS</text>
    <text class="h" x="492" y="170" fill="#032019">REST API</text>
    <text class="b" x="492" y="196" fill="#004737">Express 5 · TypeScript · zod</text>
    <text class="b" x="492" y="218" fill="#004737">JWT · bcrypt · rate limits</text>
  </g>

  <!-- Database -->
  <g>
    <rect x="900" y="112" width="260" height="136" rx="19" fill="#004737" />
    <text class="c" x="922" y="140" fill="#99b5af">DATA · NEON</text>
    <text class="h" x="922" y="170" fill="#fffbec">PostgreSQL</text>
    <text class="b" x="922" y="196" fill="#99b5af">3NF · FK cascades · indexes</text>
    <text class="b" x="922" y="218" fill="#99b5af">Prisma migrations</text>
  </g>

  <!-- Shared package ribbon -->
  <rect x="40" y="336" width="1120" height="2" rx="1" fill="#ccdad7" />
  <rect x="470" y="268" width="260" height="40" rx="20" fill="#d4ffe8" />
  <text class="b" x="600" y="293" text-anchor="middle" fill="#004737">@pms/shared — one zod schema set</text>
</svg>
