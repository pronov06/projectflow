<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="title desc">
  <title id="title">ProjectFlow — Plan it. Track it. Ship it.</title>
  <desc id="desc">Animated banner: a forest-green notched panel with a mint diagram connecting one API to the web app, the Android app and PostgreSQL.</desc>
  <style>
    /* Flecto palette — same tokens as apps/web/src/styles/tokens.css */
    .canvas { fill: #fffbec; }
    .panel { fill: #004737; }
    .mint { fill: #56f09f; }
    .mist { fill: #d4ffe8; }
    .ink { fill: #032019; }
    .forest { fill: #004737; }
    .cream { fill: #fffbec; }
    .sage { fill: #99b5af; }
    text { font-family: 'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
    .display { font-size: 44px; letter-spacing: -1.8px; }
    .wordmark { font-size: 22px; letter-spacing: -0.3px; }
    .sub { font-size: 17px; }
    .label { font-size: 13px; letter-spacing: 0.3px; }
    .chip { font-size: 13px; }

    /* Entrance: headline and subtitle rise once */
    .rise { animation: rise 900ms cubic-bezier(.22,1,.36,1) both; }
    .rise.d1 { animation-delay: 180ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* The flow: wires grow, nodes pop, cards rise — then retract and repeat (9s loop) */
    .g { transform-box: fill-box; }
    .gx { transform-origin: left center; animation: growX 9s cubic-bezier(.22,1,.36,1) infinite both; }
    .gxr { transform-origin: right center; animation: growX 9s cubic-bezier(.22,1,.36,1) infinite both; }
    .gyu { transform-origin: center bottom; animation: growY 9s cubic-bezier(.22,1,.36,1) infinite both; }
    .gyd { transform-origin: center top; animation: growY 9s cubic-bezier(.22,1,.36,1) infinite both; }
    .pop { transform-origin: center; animation: pop 9s cubic-bezier(.22,1,.36,1) infinite both; }
    @keyframes growX { 0%, 4% { transform: scaleX(0); } 12%, 86% { transform: scaleX(1); } 94%, 100% { transform: scaleX(0); } }
    @keyframes growY { 0%, 4% { transform: scaleY(0); } 12%, 86% { transform: scaleY(1); } 94%, 100% { transform: scaleY(0); } }
    @keyframes pop { 0%, 4% { opacity: 0; transform: scale(.5); } 12%, 86% { opacity: 1; transform: scale(1); } 94%, 100% { opacity: 0; transform: scale(.5); } }
    .s1 { animation-delay: .25s; } .s2 { animation-delay: .5s; } .s3 { animation-delay: .8s; }
    .s4 { animation-delay: 1.1s; } .s5 { animation-delay: 1.4s; } .s6 { animation-delay: 1.7s; }
    .s7 { animation-delay: 2.0s; } .s8 { animation-delay: 2.3s; }

    /* Live pulse on the API node */
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.9); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Cream canvas -->
  <rect class="canvas" width="1200" height="460" rx="28" />

  <!-- Notched forest panel: raised centre tab + body, concave fillets at the joins -->
  <path class="panel" d="M44 116 H272 A28 28 0 0 0 300 88 V44 A28 28 0 0 1 328 16 H872 A28 28 0 0 1 900 44 V88 A28 28 0 0 0 928 116 H1156 A28 28 0 0 1 1184 144 V416 A28 28 0 0 1 1156 444 H44 A28 28 0 0 1 16 416 V144 A28 28 0 0 1 44 116 Z" />

  <!-- Left shoulder: logo -->
  <g transform="translate(40 40)">
    <rect class="forest" x="0" y="0" width="17" height="11" rx="3" />
    <rect class="forest" x="8.5" y="11.5" width="17" height="11" rx="3" />
    <rect class="forest" x="17" y="23" width="17" height="11" rx="3" />
    <text class="wordmark forest" x="46" y="25">ProjectFlow</text>
  </g>

  <!-- Right shoulder: platform pills -->
  <g transform="translate(984 34)">
    <rect class="mist" x="0" y="0" width="84" height="40" rx="20" />
    <text class="chip forest" x="42" y="25" text-anchor="middle">Web</text>
    <rect class="mint" x="94" y="0" width="98" height="40" rx="20" />
    <text class="chip ink" x="143" y="25" text-anchor="middle">Android</text>
  </g>

  <!-- Headline in the tab -->
  <text class="display cream rise" x="600" y="86" text-anchor="middle">Plan it. Track it. Ship it.</text>
  <text class="sub sage rise d1" x="600" y="152" text-anchor="middle">Project &amp; task management · React web + Android · one Express API · one PostgreSQL database</text>

  <!-- ================= Flow diagram ================= -->
  <!-- Root: the API -->
  <g class="g pop">
    <rect class="mint" x="120" y="252" width="168" height="104" rx="22" />
    <text class="label ink" x="204" y="296" text-anchor="middle">REST API</text>
    <text class="label ink" x="204" y="317" text-anchor="middle">Express · JWT</text>
  </g>
  <circle class="mint pulse" cx="288" cy="304" r="8" />
  <circle class="mint" cx="288" cy="304" r="8" />

  <!-- Trunk to hub -->
  <rect class="mint g gx s1" x="286" y="293" width="196" height="22" />
  <g class="g pop s2">
    <rect class="mint" x="478" y="274" width="60" height="60" rx="14" />
    <rect class="forest" x="494" y="290" width="28" height="28" rx="7" />
  </g>

  <!-- Branch up: Web -->
  <rect class="mint g gyu s3" x="497" y="206" width="22" height="70" />
  <rect class="mint g gx s4" x="497" y="206" width="150" height="22" />
  <g class="g pop s5">
    <rect class="mint" x="644" y="186" width="250" height="62" rx="16" />
    <rect class="forest" x="660" y="202" width="30" height="30" rx="7" />
    <path d="M667 211 h16 v12 h-16 z M667 215 h16" fill="none" stroke="#56f09f" stroke-width="2" stroke-linejoin="round" />
    <text class="label ink" x="704" y="213">Web app</text>
    <text class="label forest" x="704" y="233">React 19 · Vite · Vercel</text>
  </g>

  <!-- Branch right: Database -->
  <rect class="mint g gx s5" x="536" y="293" width="108" height="22" />
  <g class="g pop s6">
    <rect class="mint" x="644" y="273" width="250" height="62" rx="16" />
    <rect class="forest" x="660" y="289" width="30" height="30" rx="7" />
    <ellipse cx="675" cy="297" rx="8" ry="3" fill="none" stroke="#56f09f" stroke-width="2" />
    <path d="M667 297 v13 a8 3 0 0 0 16 0 v-13" fill="none" stroke="#56f09f" stroke-width="2" />
    <text class="label ink" x="704" y="300">PostgreSQL</text>
    <text class="label forest" x="704" y="320">Prisma · Neon</text>
  </g>

  <!-- Branch down: Android -->
  <rect class="mint g gyd s6" x="497" y="332" width="22" height="70" />
  <rect class="mint g gx s7" x="497" y="380" width="150" height="22" />
  <g class="g pop s8">
    <rect class="mint" x="644" y="360" width="250" height="62" rx="16" />
    <rect class="forest" x="660" y="376" width="30" height="30" rx="7" />
    <rect x="669" y="381" width="12" height="20" rx="3" fill="none" stroke="#56f09f" stroke-width="2" />
    <text class="label ink" x="704" y="387">Android app</text>
    <text class="label forest" x="704" y="407">Expo · SecureStore</text>
  </g>

  <!-- Right column: what it does -->
  <g class="rise d1">
    <text class="label sage" x="940" y="214">✓ JWT + rotating refresh tokens</text>
    <text class="label sage" x="940" y="246">✓ Users only see their own data</text>
    <text class="label sage" x="940" y="278">✓ Search · filter · sort · paginate</text>
    <text class="label sage" x="940" y="310">✓ Live dashboard</text>
    <text class="label sage" x="940" y="342">✓ Pull-to-refresh &amp; offline mode</text>
    <text class="label sage" x="940" y="374">✓ 77 tests · CI · Docker</text>
  </g>
</svg>
