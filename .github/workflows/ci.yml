name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/projectflow_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/projectflow_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      CORS_ORIGINS: http://localhost:5173
      BCRYPT_ROUNDS: '4'
      RATE_LIMIT_REGISTER_MAX: '10000'
      RATE_LIMIT_API_MAX: '100000'
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - name: Lint
        run: npx eslint .
      - name: Typecheck
        run: npm run typecheck
      - name: Shared schema tests
        run: npm test -w @pms/shared
      - name: API unit + integration tests (with coverage)
        run: npm run test:coverage -w @pms/api
      - name: Web tests
        run: npm test -w @pms/web
      - name: Build API and web
        run: |
          npm run build -w @pms/api
          npm run build -w @pms/web
        env:
          NODE_ENV: production

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/api/Dockerfile -t projectflow-api .
      - run: docker build -f apps/web/Dockerfile -t projectflow-web .
